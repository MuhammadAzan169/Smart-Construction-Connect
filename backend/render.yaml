# =============================================================================
# Render Blueprint — BACKEND service (FREE plan compatible).
#
# This repository holds the frontend and the backend side by side, so point
# Render at this folder: set the service's "Root Directory" to `backend`
# (Blueprint) or configure the same values manually in the dashboard. The
# frontend is deployed separately on Vercel from ../frontend.
#
# FREE PLAN NOTES
#   • 512 MB RAM  → only requirements.txt is installed (no PyTorch/FAISS/OCR)
#   • ephemeral disk → DATABASE_URL + SUPABASE_* are REQUIRED for durable data
#   • spins down when idle → first request after ~15 min takes 30–60 s
# =============================================================================
services:
  - type: web
    name: smart-construction-connect-api
    runtime: python                 # switch to `docker` to build the Dockerfile
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: JWT_SECRET_KEY
        generateValue: true         # Render generates a strong random secret

      # ── Local ML is OFF on Render (512 MB cannot load PyTorch) ──
      - key: ENABLE_LOCAL_SBERT
        value: "0"

      # ── CORS: set to your Vercel URL in the dashboard ──
      #   e.g. https://your-frontend.vercel.app
      - key: CORS_ORIGINS
        sync: false

      # ── Supabase Postgres (durable document store) ──
      # Use the Supabase "Transaction pooler" URI (host ...pooler.supabase.com:6543)
      - key: DATABASE_URL
        sync: false

      # ── Supabase Storage (images, documents, attachments) ──
      - key: SUPABASE_URL
        sync: false                 # https://<project-ref>.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false                 # service_role key (backend only — keep secret)
      - key: SUPABASE_BUCKET
        value: media

      # ── AI chat (OpenRouter) ──
      - key: OPENROUTER_API_KEY1
        sync: false

      # ── Semantic search embeddings (OpenAI-compatible API; low RAM) ──
      # Leave blank to fall back to BM25 keyword search. Recommended: Cohere's
      # light multilingual model (cheapest, 384-dim, handles English + Urdu).
      - key: EMBEDDINGS_API_URL
        sync: false                 # https://api.cohere.ai/compatibility/v1
      - key: EMBEDDINGS_API_KEY
        sync: false
      - key: EMBEDDINGS_MODEL
        value: embed-multilingual-light-v3.0

      - key: LOG_LEVEL
        value: INFO
